name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  pana:
    name: Pana Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Install pana
        run: dart pub global activate pana
      
      - name: Run pana and check score
        run: |
          OUTPUT=$(dart pub global run pana --no-warning --source path . 2>&1)
          echo "$OUTPUT"
          # Extract score from "Points: 160/160" format
          SCORE=$(echo "$OUTPUT" | grep -oP 'Points: \K\d+' | head -1 || echo "0")
          if [ -z "$SCORE" ] || [ "$SCORE" = "0" ]; then
            # Fallback: try to extract from "Pana score:" if available
            SCORE=$(echo "$OUTPUT" | grep -oP 'Pana score: \K\d+' | head -1 || echo "0")
          fi
          echo "Pana score: $SCORE"
          if [ "$SCORE" -lt 160 ]; then
            echo "::error::Pana score is below 160 (current: $SCORE)"
            exit 1
          fi
          echo "✓ Pana score check passed: $SCORE/160"
      
      - name: Verify package (dry publish)
        run: flutter pub publish --dry-run

